<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: -0.03em;
      }
      .brand-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        fill: #9ca3af;
      }
      .brand-highlight {
        fill: #f97316;
        font-weight: 600;
      }
      .brand-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        fill: #6b7280;
      }
    </style>
  </defs>

  <!-- Clean Minimalist Card Background -->
  <rect width="100%" height="100%" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Brand Orange Top Border Accent -->
  <path d="M 0 12 Q 0 0 12 0 L 788 0 Q 800 0 800 12 L 800 3 L 0 3 Z" fill="#f97316"/>

  <!-- Logo Container & Mark -->
  <g transform="translate(48, 38)">
    <!-- Clean Rounded Icon Tile -->
    <rect width="84" height="84" rx="18" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <!-- Stylized Personali Head & Neural Node in Brand Colors -->
    <!-- Head Profile Contour in crisp white -->
    <path d="M 34 22 C 26 22 20 28 20 36 C 20 40 22 43 25 45 C 23 48 22 51 22 55 C 22 58 24 60 27 61 C 27 67 31 72 38 72 L 44 72 L 44 65 L 38 65 C 34 65 32 62 32 58 L 32 46 C 30 44 28 41 28 36 C 28 32 31 28 35 28 C 40 28 43 31 44 35 L 44 23 C 41 22 37 22 34 22 Z" fill="#f97316"/>
    
    <!-- Neural Node Hub (Brand Orange & Crisp White) -->
    <circle cx="56" cy="46" r="8" fill="#f97316"/>
    <circle cx="56" cy="46" r="4" fill="#ffffff"/>
    
    <!-- Neural Branches -->
    <line x1="44" y1="58" x2="44" y2="46" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="46" x2="50" y2="46" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="62" y1="42" x2="69" y2="35" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="34" r="3.5" fill="#f97316"/>

    <line x1="64" y1="46" x2="72" y2="46" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="73" cy="46" r="3.5" fill="#f97316"/>

    <line x1="62" y1="50" x2="69" y2="57" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="58" r="3.5" fill="#f97316"/>
  </g>

  <!-- Typography & Copy -->
  <g transform="translate(160, 42)">
    <!-- Eyebrow Tag -->
    <text x="0" y="16" class="brand-sub">OPEN-SOURCE AI PLATFORMS &amp; SDKS</text>
    
    <!-- Main Brand Title -->
    <text x="0" y="54" class="brand-title">
      <tspan fill="#f8fafc">Personali</tspan><tspan fill="#f97316">A</tspan><tspan fill="#f8fafc">i</tspan>
    </text>
    
    <!-- Brand Tagline matching website -->
    <text x="0" y="82" class="brand-tagline">
      AI tools built for <tspan class="brand-highlight">your</tspan> life &amp; work.
    </text>
  </g>

  <!-- Clean Live Badge on Right -->
  <g transform="translate(670, 48)">
    <rect width="90" height="26" rx="13" fill="#111827" stroke="#374151" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#f97316"/>
    <text x="27" y="17" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
      Active
    </text>
  </g>
</svg>
