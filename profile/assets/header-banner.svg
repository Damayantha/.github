<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="nebulaCyan" cx="25%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="75%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.35"/>
    </pattern>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      .floating-logo {
        animation: float 6s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-core {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .dashed-circuit {
        stroke-dasharray: 6 6;
        animation: dashAnim 20s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>
  <rect width="100%" height="100%" fill="url(#nebulaCyan)"/>
  <rect width="100%" height="100%" fill="url(#nebulaPurple)"/>
  <rect width="100%" height="100%" fill="url(#cyberGrid)"/>

  <!-- Subtle Cybernetic Horizon Lines -->
  <g opacity="0.35">
    <line x1="0" y1="210" x2="1200" y2="210" stroke="url(#borderGrad)" stroke-width="1" class="dashed-circuit"/>
    <line x1="100" y1="120" x2="350" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="850" y1="120" x2="1100" y2="120" stroke="#c084fc" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="150" y1="310" x2="400" y2="310" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="800" y1="310" x2="1050" y2="310" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <!-- Constellation Nodes & Connecting Rays -->
  <g opacity="0.4">
    <!-- Left constellation -->
    <circle cx="160" cy="180" r="3" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="240" cy="110" r="2.5" fill="#818cf8"/>
    <circle cx="280" cy="240" r="3.5" fill="#06b6d4" filter="url(#softGlow)"/>
    <line x1="160" y1="180" x2="240" y2="110" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4"/>
    <line x1="160" y1="180" x2="280" y2="240" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.4"/>

    <!-- Right constellation -->
    <circle cx="1040" cy="180" r="3" fill="#c084fc" filter="url(#softGlow)"/>
    <circle cx="960" cy="110" r="2.5" fill="#818cf8"/>
    <circle cx="920" cy="240" r="3.5" fill="#ec4899" filter="url(#softGlow)"/>
    <line x1="1040" y1="180" x2="960" y2="110" stroke="#c084fc" stroke-width="0.75" stroke-opacity="0.4"/>
    <line x1="1040" y1="180" x2="920" y2="240" stroke="#ec4899" stroke-width="0.75" stroke-opacity="0.4"/>
  </g>

  <!-- Central Logo & Neural Orb -->
  <g class="floating-logo" transform="translate(600, 115)">
    <!-- Outer Aura Glow -->
    <circle cx="0" cy="0" r="64" fill="#6366f1" fill-opacity="0.15" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="48" fill="#8b5cf6" fill-opacity="0.2" filter="url(#glow)"/>

    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="url(#primaryGrad)" stroke-width="1.8" opacity="0.7" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="url(#primaryGrad)" stroke-width="1.8" opacity="0.7" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" transform="rotate(90)"/>

    <!-- Glowing Core -->
    <circle cx="0" cy="0" r="26" fill="url(#primaryGrad)" class="pulsing-core" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Central Sparkle Glyph -->
    <path d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z" fill="#0f172a"/>
  </g>

  <!-- Top Pill / Status Tag -->
  <g transform="translate(600, 205)">
    <rect x="-190" y="-14" width="380" height="28" rx="14" fill="url(#badgeGrad)" stroke="url(#borderGrad)" stroke-width="1"/>
    <circle cx="-168" cy="0" r="4" fill="#10b981" filter="url(#softGlow)"/>
    <text x="-152" y="4" fill="#cbd5e1" font-size="11" class="badge-text">
      NEXT-GEN OPEN-SOURCE AI INFRASTRUCTURE
    </text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="270" text-anchor="middle" fill="url(#primaryGrad)" font-size="52" class="title-text" filter="url(#softGlow)">
    PersonaliAI
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="306" text-anchor="middle" fill="#94a3b8" font-size="16.5" class="subtitle-text">
    Real-Time Multimodal Voice · Autonomous Support Agents · Cross-Platform Native SDKs
  </text>

  <!-- Capability Badges Footer Row -->
  <g transform="translate(600, 355)">
    <!-- Badge 1: Chatty Platform -->
    <g transform="translate(-390, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        💬 Chatty Engine
      </text>
    </g>

    <!-- Badge 2: LiveKit Voice -->
    <g transform="translate(-195, 0)">
      <rect x="-90" y="-15" width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        🎙️ LiveKit Voice Agent
      </text>
    </g>

    <!-- Badge 3: Autonomous Kin -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        🧬 Kin Assistant
      </text>
    </g>

    <!-- Badge 4: Native Mobile SDKs -->
    <g transform="translate(195, 0)">
      <rect x="-90" y="-15" width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        📱 Native Mobile SDKs
      </text>
    </g>

    <!-- Badge 5: Self-Hostable -->
    <g transform="translate(390, 0)">
      <rect x="-85" y="-15" width="170" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
        🐳 100% Self-Hostable
      </text>
    </g>
  </g>

  <!-- Subtle Outer Border Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6"/>
</svg>
